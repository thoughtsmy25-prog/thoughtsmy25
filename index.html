<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Interest Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff); color: #172554;
    }
    main {
      width: min(100%, 440px); padding: 30px; border-radius: 18px;
      background: white; box-shadow: 0 18px 50px #1e1b4b20;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { color: #475569; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 1rem;
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0;
      border-radius: 9px; background: #4f46e5; color: white;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #result {
      display: none; margin-top: 20px; padding: 16px; border-radius: 10px;
      background: #eef2ff; line-height: 1.8;
    }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Simple Interest Calculator</h1>
    <p>Enter the principal, annual interest rate, and time in years.</p>
    <form id="calculator">
      <label for="principal">Principal amount</label>
      <input id="principal" type="number" min="0" step="any" required placeholder="e.g. 1000">
      <label for="rate">Annual interest rate (%)</label>
      <input id="rate" type="number" min="0" step="any" required placeholder="e.g. 5">
      <label for="time">Time (years)</label>
      <input id="time" type="number" min="0" step="any" required placeholder="e.g. 2">
      <button type="submit">Calculate</button>
    </form>
    <section id="result" aria-live="polite"></section>
  </main>
  <script>
    document.getElementById("calculator").addEventListener("submit", function (event) {
      event.preventDefault();
      const principal = Number(document.getElementById("principal").value);
      const rate = Number(document.getElementById("rate").value);
      const time = Number(document.getElementById("time").value);
      const output = document.getElementById("result");
      if (![principal, rate, time].every(Number.isFinite) ||
          principal < 0 || rate < 0 || time < 0) {
        output.className = "error";
        output.textContent = "Please enter valid non-negative numbers.";
        output.style.display = "block";
        return;
      }
      const interest = (principal * rate * time) / 100;
      const total = principal + interest;
      output.className = "";
      output.innerHTML =
        "<strong>Simple Interest:</strong> " + interest.toFixed(2) +
        "<br><strong>Total Amount:</strong> " + total.toFixed(2);
      output.style.display = "block";
    });
  </script>
</body>
</html>
